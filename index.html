<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#12151a;color:#e6e6e6}

button{background:#2d6cdf;color:#fff;border:0;border-radius:5px;padding:4px 8px;cursor:pointer}
code{background:#232932;padding:1px 5px;border-radius:4px}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:16px;cursor:zoom-out}
#lb img{max-width:min(1000px,100%);display:block;margin:0 auto}
#lb p{max-width:1000px;margin:12px auto;font-size:14px;line-height:1.5}
</style></head><body>

const $ = s => document.querySelector(s);
[...new Set(DATA.map(d => d.size))].sort((a, b) => a - b).forEach(s => $("#size").append(new Option(s, s)));
function render() {
  const q = $("#q").value.toLowerCase().split(",").map(x => x.trim()).filter(Boolean);
  const size = $("#size").value, min = +$("#min").value || 0;
  const r = DATA.filter(d => (!size || d.size == size) && d.n >= min &&
    q.every(t => d.monu.some(m => m.toLowerCase().includes(t))));
  r.sort($("#sort").value === "n" ? (a, b) => b.n - a.n : (a, b) => a.size - b.size || a.seed - b.seed);
  $("#grid").innerHTML = r.map(d => `<div class="card" data-id="${d.id}">
    <img loading="lazy" src="thumb/${d.id}.webp">
    <div class="info"><span><b>${d.size}</b> · <code>${d.seed}</code> · ${d.n} monum.</span>
    <button data-seed="${d.seed}">copiar</button></div></div>`).join("");
  $("#count").textContent = r.length + " mapas";
}
$("#grid").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { navigator.clipboard.writeText(b.dataset.seed); b.textContent = "ok"; setTimeout(() => b.textContent = "copiar", 900); return; }
  const c = e.target.closest(".card"); if (!c) return;
  const d = DATA.find(x => x.id === c.dataset.id);
  $("#lb").innerHTML = `<img src="img/${d.id}.webp"><p><b>Tamaño ${d.size} · semilla ${d.seed}</b><br>${d.monu.join(" · ")}</p>`;
  $("#lb").style.display = "block";
});
$("#lb").onclick = () => $("#lb").style.display = "none";
["q", "size", "min", "sort"].forEach(i => $("#" + i).addEventListener("input", render));
render();
</script></body></html>
